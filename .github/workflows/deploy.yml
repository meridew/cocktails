name: gate + deploy (Mac)

# Push gates. Deploying is a separate, manual act:
#
#     gh workflow run "gate + deploy (Mac)" --ref main -f deploy=true
#
# Both jobs run on the Mac mini, which is also the host. That would have been a bad
# idea on the NAS — a 4-core Synology sharing memory with two VMs, SQL Server and
# Plex, where merging the gate onto the box was tried and took 472s at load average
# 74. The M4 runs the same gate in about ten seconds, so the argument reversed.
#
# There is no Docker here. The app is a launchd service running node directly; a
# deploy is a fetch, a build and a restart. See docs/PLATFORM-PLAN.md §2.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Restart the live service with this commit (otherwise just gate)'
        type: boolean
        default: false

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: [self-hosted, mac]
    steps:
      - uses: actions/checkout@v4

      # No setup-node: the Mac's Node is pinned by Homebrew to the major version
      # package.json asks for. Installing a second one per run would be slower and
      # would hide a mismatch between CI and the thing actually serving traffic.
      - name: Node version matches package.json
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          node --version
          npm --version

      - name: Install
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          npm ci

      # **`npm test` gates; `npm run test:e2e` does not.** That split is deliberate and
      # was arrived at the hard way, so it is written down rather than rediscovered.
      #
      # The fast suite runs in about six seconds, needs no browser, and did not break
      # at all through a refactor that moved routes and rewrote components — because
      # it tests behaviour rather than appearance. It also holds the capability matrix
      # and the tenancy-isolation checks, which are the only things standing between a
      # change and one party's guest seeing another party's queue. Cheap, and guarding
      # the one bug class here that would genuinely matter.
      #
      # The end-to-end suite is a different trade. It drives a real browser, and its
      # specs are coupled to button labels and URLs — so a deliberate UI change breaks
      # a dozen of them at once and the work becomes renaming fixtures. It still passes
      # and is still worth running by hand before anything ships (`npm run test:e2e`),
      # but gating on it taxes exactly the redesign work this app is in the middle of.
      #
      # `e2e/layout.spec.ts` is gone entirely. It measured WCAG contrast ratios and
      # flex widths in pixels; it earned its place once, catching text that rendered at
      # a contrast ratio of 1.0 — invisible — but it broke on every restyle afterwards,
      # and the last time it failed the text it was complaining about measured 11:1 and
      # was perfectly legible. A test that cries wolf on a redesign is a test that gets
      # deleted in a hurry later; better to do it deliberately now.
      - name: Format, typecheck and test
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          npm run format:check
          npm run check
          npm test

      # The build stays, and it matters more now than it did.
      #
      # `npm run test:e2e` built the app as its first step, so removing it removed
      # the only proof in CI that the thing compiles. Without this, a push that
      # breaks the build would gate green and then fail on the Mac at deploy time,
      # with the service already restarted.
      - name: It builds
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          npm run build

  deploy:
    needs: gate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: [self-hosted, mac]
    steps:
      - name: Back up SQLite before migration
        run: |
          set -e
          umask 077
          cd "$HOME/apps/cocktails"
          set -a
          . "$HOME/.config/cocktails/env"
          set +a
          DB="${DB_PATH:-data/cocktails.sqlite}"
          BACKUP_DIR="$HOME/.local/share/cocktails/backups"
          BACKUP="$BACKUP_DIR/cocktails-$(date -u +%Y%m%dT%H%M%SZ).sqlite"
          test -f "$DB"
          mkdir -p "$BACKUP_DIR"
          /usr/bin/sqlite3 "$DB" ".timeout 10000" ".backup '$BACKUP'"
          test "$(/usr/bin/sqlite3 "$BACKUP" 'PRAGMA integrity_check;')" = "ok"
          echo "consistent SQLite backup: $BACKUP ($(stat -f%z "$BACKUP") bytes)"

      # Deliberately not a checkout: the live tree is ~/apps/cocktails, which is what
      # launchd runs. The runner's own workspace is a different directory, and
      # building there would gate one copy while serving another.
      - name: Update, build and restart
        run: |
          set -e
          eval "$(/opt/homebrew/bin/brew shellenv)"
          cd "$HOME/apps/cocktails"
          git fetch --quiet origin
          git reset --hard --quiet "${{ github.sha }}"
          npm ci
          npm run build
          launchctl kickstart -k "gui/$(id -u)/com.meridew.cocktails"

      - name: Wait for it to answer
        run: |
          set -e
          PORT=$(grep '^PORT=' "$HOME/.config/cocktails/env" | cut -d= -f2)
          for i in $(seq 1 20); do
            if curl -fsS -m 3 "http://127.0.0.1:${PORT}/api/health" >/dev/null; then
              echo "healthy on :${PORT} after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "service did not come back — check ~/Library/Logs/cocktails.log"
          tail -30 "$HOME/Library/Logs/cocktails.log" || true
          exit 1

      # The one piece of production config this repo cannot hold.
      #
      # Cloudflare caches by file extension and `.js` is on its default list, so
      # `/service-worker.js` was being served from the edge for four hours after
      # every deploy — long enough for a fresh install to be handed the *previous*
      # worker, which then deletes the current cache on activate and serves its own,
      # origin-wide. adapter-node cannot set a header on a static file, so the fix
      # is a Cache Rule in the dashboard (recorded in docs/PLATFORM-PLAN.md §9) and
      # nothing in git would notice it being deleted. This does.
      #
      # Twice on purpose: with the rule it is DYNAMIC both times; without it the
      # first request is a MISS that *fills* the cache and the second is the HIT.
      # Checking once would pass on exactly the deploy that broke it.
      - name: The service worker is not edge-cached
        run: |
          set -e
          URL=https://cock.meridew.com/service-worker.js
          curl -fsS -m 10 -o /dev/null "$URL"
          STATUS=$(curl -fsS -m 10 -D - -o /dev/null "$URL" | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="cf-cache-status"{print $2}')
          echo "cf-cache-status: ${STATUS:-none}"
          if [ "$STATUS" = "HIT" ]; then
            echo "::error::Cloudflare is caching /service-worker.js — the 'Never cache the service worker' Cache Rule is missing or broken. Until it is restored, a fresh install can be served the previous service worker for up to four hours. See docs/PLATFORM-PLAN.md §9."
            exit 1
          fi
