name: gate + deploy (NAS)

# Push gates. Deploying is a separate, manual act.
#
# Every push used to deploy, which put a ~110s NAS round-trip in the middle of
# iterating — for a site nobody is looking at between changes. The gate still runs
# on every push (it's ~45s on a cloud runner and costs the NAS nothing), so a
# regression is caught immediately; the deploy waits until someone actually wants
# the change on a phone:
#
#     gh workflow run "gate + deploy (NAS)" --ref modernise -f deploy=true
#
# The split is deliberate and load-bearing, not duplication. The NAS is a 4-core
# Synology sharing memory with two long-lived VMs, SQL Server and Plex; it often has
# under 1 GB available. Merging the gate onto it was tried and failed outright —
# `npm ci` + typecheck + 237 tests (the auth suite is scrypt at 96 MiB a hash) on a
# box already at load 70. And BuildKit was being OOM-killed compiling the client.
#
# The cloud runner does everything that needs CPU or memory. The NAS job only
# assembles an image from the result and restarts one container.
on:
  push:
    branches: [modernise, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Build and deploy to the NAS (otherwise just gate)'
        type: boolean
        default: true

concurrency:
  group: nas-deploy
  # Supersede an in-flight deploy rather than queueing behind it: pushing twice in
  # quick succession should land the second one, not wait out the first. (Queueing
  # mattered when the site had to stay up; it doesn't.)
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Deliberately no VAPID_* env here: with the keys unset, push.ts is inert and
      # the suite makes zero outbound requests. Adding them would make the
      # order-status tests hit real push services and flake.
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

      # Hand the built app to the NAS rather than making it compile one.
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: build
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: check
    # Manual only. `github.event.inputs.deploy` is unset for a push, so this is
    # false there — which is the point.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: [self-hosted, nas]
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile copies this in; it never builds it.
      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: build

      - name: Write infra/.env
        run: |
          cat > infra/.env <<EOF
          APP_IMAGE=cocktails-app:local
          ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
          PUBLIC_ORIGIN=https://cock.meridew.com
          PUBLIC_PORT=8088
          STAFF_EMAIL=${STAFF_EMAIL}
          STAFF_PASSWORD=${STAFF_PASSWORD}
          STAFF_PIN=${STAFF_PIN}
          TUNNEL_TOKEN=${TUNNEL_TOKEN}
          VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
          VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
          VAPID_SUBJECT=${VAPID_SUBJECT}
          EOF
        env:
          STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          STAFF_PIN: ${{ secrets.STAFF_PIN }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:bar@meridew.com
          ALLOWED_ORIGIN: https://cock.meridew.com,capacitor://localhost,https://localhost

      - name: Build + deploy
        working-directory: infra
        run: |
          # Bring up the Cloudflare Tunnel only once a token secret exists.
          if [ -n "${TUNNEL_TOKEN}" ]; then export COMPOSE_PROFILES=tunnel; fi
          docker-compose -f docker-compose.yml -f docker-compose.build.yml up -d --build --remove-orphans
          docker image prune -f --filter "label=com.docker.compose.project=cocktails"
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          # Legacy builder, not BuildKit. BuildKit spawns a frontend container per
          # Dockerfile and they were dying on this box ("frontend grpc server closed
          # unexpectedly") regardless of what was being built. These images are now
          # three FROM/COPY files with nothing BuildKit is needed for.
          DOCKER_BUILDKIT: '0'
          COMPOSE_DOCKER_CLI_BUILD: '0'
