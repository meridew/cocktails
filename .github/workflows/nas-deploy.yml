name: deploy (NAS)

# One job on the NAS runner: gate, then build + deploy. Nothing inbound; no GHCR.
#
# The gate used to run as a separate job on a GitHub-hosted runner, which cost a
# second checkout, a second `npm ci`, and ~15s of VM provisioning on every push —
# to re-prove something the Docker build proves again moments later. Merging them
# removes that, and takes GitHub-hosted usage to zero.
on:
  push:
    branches: [modernise, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: nas-deploy
  # Supersede an in-flight deploy rather than queueing behind it: pushing twice in
  # quick succession should land the *second* one, not wait out the first. (This was
  # deliberately false when the site had to stay up; it doesn't.)
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, nas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Deliberately no VAPID_* env here: with the keys unset, push.ts is inert and
      # the suite makes zero outbound requests. Adding them would make the
      # order-status tests hit real push services and flake.
      - name: Gate
        run: npm run format:check && npm run check && npm test

      - name: Write infra/.env
        run: |
          cat > infra/.env <<EOF
          API_IMAGE=cocktails-api:local
          WEB_IMAGE=cocktails-web:local
          CADDY_IMAGE=cocktails-caddy:local
          ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
          PUBLIC_PORT=8088
          STAFF_EMAIL=${STAFF_EMAIL}
          STAFF_PASSWORD=${STAFF_PASSWORD}
          STAFF_PIN=${STAFF_PIN}
          TUNNEL_TOKEN=${TUNNEL_TOKEN}
          VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
          VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
          VAPID_SUBJECT=${VAPID_SUBJECT}
          EOF
        env:
          STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          STAFF_PIN: ${{ secrets.STAFF_PIN }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:bar@meridew.com
          ALLOWED_ORIGIN: https://cock.meridew.com,capacitor://localhost,https://localhost

      # The web image builds the client, so there's no separate build step above.
      - name: Build + deploy
        working-directory: infra
        run: |
          # Bring up the Cloudflare Tunnel only once a token secret exists.
          if [ -n "${TUNNEL_TOKEN}" ]; then export COMPOSE_PROFILES=tunnel; fi
          docker-compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
          docker image prune -f --filter "label=com.docker.compose.project=cocktails"
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
