name: deploy (NAS)

# Push -> GitHub cloud runner gates (fast, and costs the NAS nothing) -> if green,
# the self-hosted NAS runner builds + deploys. Nothing inbound; no GHCR.
#
# The split is deliberate and load-bearing, not duplication. The NAS is a 4-core
# Synology sharing memory with two long-lived VMs, SQL Server and Plex; it often has
# under 1 GB available. Merging the gate onto it was tried and failed outright —
# `npm ci` + typecheck + 235 tests (the auth suite is scrypt at 96 MiB a hash) on a
# box already at load 70. And BuildKit was being OOM-killed compiling the client.
#
# So the cloud runner does everything that needs CPU or memory — gate, and building
# the client bundle — and hands `dist/` to the NAS as an artifact. The NAS job only
# copies files into images and restarts containers.
on:
  push:
    branches: [modernise, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: nas-deploy
  # Supersede an in-flight deploy rather than queueing behind it: pushing twice in
  # quick succession should land the second one, not wait out the first. (Queueing
  # mattered when the site had to stay up; it doesn't.)
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Deliberately no VAPID_* env here: with the keys unset, push.ts is inert and
      # the suite makes zero outbound requests. Adding them would make the
      # order-status tests hit real push services and flake.
      - name: Format check
        run: npm run format:check
      - name: Typecheck + svelte-check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build web
        run: npm -w @cocktails/web run build

      # Hand the bundle to the NAS rather than making it compile one.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: check
    runs-on: [self-hosted, nas]
    steps:
      - uses: actions/checkout@v4

      # apps/web/Dockerfile copies this in; it never builds it.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Write infra/.env
        run: |
          cat > infra/.env <<EOF
          API_IMAGE=cocktails-api:local
          WEB_IMAGE=cocktails-web:local
          CADDY_IMAGE=cocktails-caddy:local
          ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
          PUBLIC_PORT=8088
          STAFF_EMAIL=${STAFF_EMAIL}
          STAFF_PASSWORD=${STAFF_PASSWORD}
          STAFF_PIN=${STAFF_PIN}
          TUNNEL_TOKEN=${TUNNEL_TOKEN}
          VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
          VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
          VAPID_SUBJECT=${VAPID_SUBJECT}
          EOF
        env:
          STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          STAFF_PIN: ${{ secrets.STAFF_PIN }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:bar@meridew.com
          ALLOWED_ORIGIN: https://cock.meridew.com,capacitor://localhost,https://localhost

      - name: Build + deploy
        working-directory: infra
        run: |
          # Bring up the Cloudflare Tunnel only once a token secret exists.
          if [ -n "${TUNNEL_TOKEN}" ]; then export COMPOSE_PROFILES=tunnel; fi
          docker-compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
          docker image prune -f --filter "label=com.docker.compose.project=cocktails"
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
