# Cocktails on the NAS (Synology Container Manager).
#
# Two containers. It was four — api, web (nginx), caddy, cloudflared — until
# adapter-node started serving the app and /api from one process. Caddy then had
# nothing left to do: static files are the app's job now, and the security headers
# moved into hooks.server.ts. cloudflared dials straight out to the app.
name: cocktails

services:
  app:
    image: ${APP_IMAGE:-cocktails-app:local}
    restart: unless-stopped
    environment:
      # Port 80, and aliased as `caddy` below, purely so the Cloudflare tunnel's
      # existing ingress rule (http://caddy:80) keeps working. That rule lives in
      # the Cloudflare dashboard, not this repo, so matching the old address is
      # what makes this deploy need no manual step. Repoint it at http://app:3000
      # whenever convenient and both of these can go.
      PORT: '80'
      ORIGIN: ${PUBLIC_ORIGIN:-https://cock.meridew.com}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://cock.meridew.com}
      STAFF_EMAIL: ${STAFF_EMAIL:-bar@local}
      # No default password: unset → a random one is generated in production, so a
      # missing STAFF_PASSWORD secret can never leave a known public login.
      STAFF_PASSWORD: ${STAFF_PASSWORD:-}
      # Short PIN for the same admin account — the everyday door. Same rule: unset
      # means PIN sign-in is simply off, never a guessable default.
      STAFF_PIN: ${STAFF_PIN:-}
      DB_PATH: /data/cocktails.sqlite
      # Web Push (VAPID). Empty → push disabled and the sender no-ops.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:bar@meridew.com}
      # adapter-node's own guard, below the app's 256KB check.
      BODY_SIZE_LIMIT: '512K'
    volumes:
      - cocktails-data:/data
    # LAN access, and a target for the router port-forward if it's ever wanted.
    ports:
      - '${PUBLIC_PORT:-8088}:80'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      internal:
        aliases: [caddy]

  # Cloudflare Tunnel — public HTTPS with NO inbound ports (it dials out).
  # Dormant unless the `tunnel` profile is active (CI enables it only when a
  # TUNNEL_TOKEN secret is set). The tunnel's Public Hostname in the Cloudflare
  # dashboard must now point at http://app:3000, not the old caddy:80.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ['tunnel']
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

volumes:
  cocktails-data:

networks:
  internal:
